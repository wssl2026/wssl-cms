<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>WSSL Site Editor</title>
  <link href="/admin/config.yml" type="application/yaml" rel="cms-config-url" />
</head>
<body>
  <script>window.CMS_MANUAL_INIT = true;</script>
  <!-- Served from our own origin, vendored by `npm run build` from the exact @sveltia/cms
       version pinned in package.json. Never a CDN: a third-party script tag here could
       ship new code into the page that commits to the site. -->
  <script src="/admin/sveltia-cms.js"></script>
  <script>
    // Styles the preview pane roughly like the live site (PT Sans, navy/gold, prose
    // spacing) and hides the field labels ("Title", "Body") left over from the default
    // preview — see public/admin/preview.css for the full explanation. Metadata fields
    // (path, description, draft, updated, legacyUrl) are hidden from the preview pane
    // entirely via `preview: false` in config.yml, so only title + body reach this CSS.
    window.CMS.registerPreviewStyle('/admin/preview.css');
  </script>
  <script>
    // Everything that does not depend on where this page is served from lives in
    // config.yml; Sveltia merges what follows over it. `base_url` (where the sign-in
    // popup opens) and `api_root` (where the GitHub API calls go) are both this origin,
    // and this page is served from three of them — wssl-cms.pages.dev, www.wssl.org and
    // localhost during development — so they are read off the page rather than pinned to
    // one host in the config file.
    //
    // /api/cms/auth returns the editor's session token; /api/cms/gh is the proxy that
    // swaps it for the bot token. Cloudflare Access protects both, so the editor's email
    // sign-in is what stands behind every commit. Sveltia turns `api_root` into
    // `<api_root>/api/v3` for REST and `<api_root>/api/graphql` for GraphQL, and the
    // proxy accepts both shapes.
    // `site_url` follows the same rule so the "view on site" links open the copy of the
    // site this editor belongs to (staging while on pages.dev, production after cutover).
    window.CMS.init({
      config: {
        site_url: window.location.origin,
        display_url: window.location.origin,
        backend: {
          base_url: window.location.origin,
          api_root: window.location.origin + '/api/cms/gh',
        },
      },
    });
  </script>
</body>
</html>
