<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>WSSL Site Editor</title>
</head>
<body>
  <script>window.CMS_MANUAL_INIT = true;</script>
  <!-- Pinned: a floating range would let the CDN ship new editor code into /admin unreviewed. -->
  <script src="https://unpkg.com/decap-cms@3.16.0/dist/decap-cms.js"></script>
  <script>
    // Use the local git proxy (`npx decap-server`) only when developing on localhost.
    var isLocal = ['localhost', '127.0.0.1'].includes(window.location.hostname);
    window.CMS.init({ config: isLocal ? { local_backend: true } : {} });
  </script>
</body>
</html>
