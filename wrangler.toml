name = "wssl-cms"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "dist"

[vars]
# Questions answered per day before Ask WSSL turns itself off. See README "Cost".
DAILY_CAP = "200"

# Which model answers Ask WSSL: "gemini" or "anthropic". The matching secret
# (GEMINI_API_KEY or ANTHROPIC_API_KEY) must be set for whichever is selected.
# Run `npm run check-gemini-model` once to confirm GEMINI_MODEL exists for the key.
LLM_PROVIDER = "gemini"
GEMINI_MODEL = "gemini-3.8-flash"

# How the Gemini provider gets the site's content in front of the model. "index" (the default)
# sends a one-line-per-page map and lets the model fetch the pages it needs with a read_pages
# tool; "cache" sends the whole corpus once an hour through a Google explicit context cache.
# See README "How Ask WSSL answers". Any other value is treated as "index".
GEMINI_RETRIEVAL = "index"

# Task 19: logs each Ask WSSL question to a Google Sheet via a Google Apps Script web app. Set
# to the deployed web app URL to turn logging on; leave empty (the default) to keep it off — the
# matching QUESTION_LOG_SECRET Pages secret must also be set. See README "Question log (Google
# Sheet)".
QUESTION_LOG_URL = ""

# The content repository the editor at /admin commits to. Placeholders — see README
# "Before this goes live". The bot token itself is the GITHUB_BOT_TOKEN secret, set in
# the Cloudflare dashboard (and in .dev.vars locally), never here.
GITHUB_REPO = "wssl2026/wssl-cms"
GITHUB_BRANCH = "main"

# Cloudflare Access, which is what lets editors sign in by email. The team domain is
# shown in Zero Trust → Settings → Custom Pages; the AUD tag is on the Access
# application's Overview tab.
CF_ACCESS_TEAM_DOMAIN = "wssl.cloudflareaccess.com"
CF_ACCESS_AUD = "f7ba57c368cdc9b179bd0c6337bc28e16bdd19129676de8b250ba3184e64add6"

[[kv_namespaces]]
binding = "USAGE"
id = "8b18d398d5d64a7b87c7ae99aea5820b"
preview_id = "8b18d398d5d64a7b87c7ae99aea5820b"
