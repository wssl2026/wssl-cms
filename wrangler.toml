name = "wssl-cms"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "dist"

[vars]
# Questions answered per day before Ask WSSL turns itself off. See README "Cost".
DAILY_CAP = "200"

# The content repository the editor at /admin commits to. Placeholders — see README
# "Before this goes live". The bot token itself is the GITHUB_BOT_TOKEN secret, set in
# the Cloudflare dashboard (and in .dev.vars locally), never here.
GITHUB_REPO = "OWNER/REPO"
GITHUB_BRANCH = "main"

# Cloudflare Access, which is what lets editors sign in by email. The team domain is
# shown in Zero Trust → Settings → Custom Pages; the AUD tag is on the Access
# application's Overview tab.
CF_ACCESS_TEAM_DOMAIN = "<team>.cloudflareaccess.com"
CF_ACCESS_AUD = "<aud tag>"

[[kv_namespaces]]
binding = "USAGE"
# Replace with the ids printed by: npx wrangler kv namespace create USAGE [--preview]  (Task 12)
id = "00000000000000000000000000000000"
preview_id = "00000000000000000000000000000000"
